<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout responsivo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eee;
        }

        .container {
            display: grid;
            min-height: 100vh;
            padding: 8px;
            gap: 6px;
            box-sizing: border-box;
            background-color: white;
            grid-template-columns: 1fr 4fr 1fr;
            grid-template-rows: 50px 40px 1fr 40px 30px;
            grid-template-areas:
                "header header header"
                "left banner right"
                "left main right"
                "left low right"
                "footer footer footer";
        }

        .container div {
            font-weight: bold;
            font-size: 13px;
            padding: 10px;
        }

        .header {
            grid-area: header;
            background-color: #f2b400;
            text-align: center;
        }

        .left {
            grid-area: left;
            background-color: #0f9d58;
        }

        .banner {
            grid-area: banner;
            background-color: #db4437;
            text-align: center;
        }

        .main {
            grid-area: main;
            background-color: #4285f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main h2 {
            margin: 0;
            font-size: 18px;
        }

        .low {
            grid-area: low;
            background-color: #0f9d58;
        }

        .right {
            grid-area: right;
            background-color: #f2b400;
        }

        .footer {
            grid-area: footer;
            background-color: #4285f4;
            text-align: center;
        }

        @media screen and (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 40px 40px 40px 1fr 40px 40px 40px;
                grid-template-areas:
                    "header"
                    "banner"
                    "left"
                    "main"
                    "right"
                    "low"
                    "footer";
            }

            .main {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="left">Left Aside</div>
        <div class="banner">Banner</div>
        <div class="main">
            <h2>Main Content</h2>
        </div>
        <div class="right">Right Aside</div>
        <div class="low">Low Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
