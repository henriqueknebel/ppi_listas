<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Layout 3 - Grid</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
        }

        .container {
            display: grid;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            grid-template-columns: 3fr 2fr 3.4fr 2fr;
            grid-template-rows: 1fr 2.2fr;
            gap: 20px;
        }

        .caixa {
            background-color: #444;
            color: white;
            border-radius: 8px;
            padding: 20px 40px;
            font-size: 45px;
        }

        .a {
            grid-column: 1 / 3;
        }

        .b {
            grid-column: 4 / 5;
        }

        .c {
            grid-column: 1 / 2;
        }

        .d {
            grid-column: 2 / 5;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 40px;
        }

        .d div {
            background-color: #ccc;
            color: #444;
            border-radius: 8px;
            padding: 30px 40px;
            font-size: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa a">A</div>
        <div class="caixa b">B</div>
        <div class="caixa c">C</div>
        <div class="caixa d">
            <div>E</div>
            <div>F</div>
            <div>G</div>
            <div>M</div>
            <div>I</div>
            <div>J</div>
        </div>
    </div>
</body>
</html>
