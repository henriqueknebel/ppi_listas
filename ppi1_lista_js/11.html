<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Eventos em JavaScript</title>
    <style>
        #hoverDiv {
            width: 200px;
            padding: 20px;
            margin: 15px 0;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <button id="alertButton">Clique aqui</button>
    <input type="text" id="textInput" placeholder="Digite algo">
    <div id="hoverDiv">Passe o mouse aqui</div>
    <select id="colorSelect">
        <option value="">Escolha uma cor</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Vermelho</option>
    </select>

    <script>
        const botao = document.getElementById("alertButton");
        const campo = document.getElementById("textInput");
        const div = document.getElementById("hoverDiv");
        const select = document.getElementById("colorSelect");

        // a) click
        botao.addEventListener("click", function () {
            alert("Você clicou no botão!");
        });

        // b) keydown
        campo.addEventListener("keydown", function (evento) {
            console.log(`Tecla: ${evento.key}`);
        });

        // c) focus
        campo.addEventListener("focus", function () {
            campo.style.backgroundColor = "yellow";
        });

        // d) blur
        campo.addEventListener("blur", function () {
            campo.style.backgroundColor = "";
        });

        // e) mouseover
        div.addEventListener("mouseover", function () {
            div.style.backgroundColor = "lightblue";
        });

        // f) mouseout
        div.addEventListener("mouseout", function () {
            div.style.backgroundColor = "lightgray";
        });

        // g) change
        select.addEventListener("change", function () {
            document.body.style.backgroundColor = select.value;
        });
    </script>
</body>
</html>
