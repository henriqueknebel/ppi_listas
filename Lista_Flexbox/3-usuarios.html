<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de usuários</title>
    <style>
        body {
            margin: 0;
            background-color: #a6a6a6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .lista {
            width: 400px;
            background-color: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .usuario {
            display: flex;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid #e5e5e5;
        }

        .usuario:last-child {
            border-bottom: none;
        }

        .usuario img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .info {
            display: flex;
            flex-direction: column;
        }

        .nome {
            font-weight: bold;
            font-size: 18px;
            color: #555;
            margin-bottom: 5px;
        }

        .endereco {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="lista">
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/women/17.jpg" alt="Linda Hart">
            <div class="info">
                <span class="nome">Linda Hart</span>
                <span class="endereco">6765 Shady Ln Dr</span>
            </div>
        </div>
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/22.jpg" alt="Roger Medina">
            <div class="info">
                <span class="nome">Roger Medina</span>
                <span class="endereco">2420 Paddock Way</span>
            </div>
        </div>
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Dean Sullivan">
            <div class="info">
                <span class="nome">Dean Sullivan</span>
                <span class="endereco">6727 Airplane Ave</span>
            </div>
        </div>
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/women/50.jpg" alt="Elizabeth Austin">
            <div class="info">
                <span class="nome">Elizabeth Austin</span>
                <span class="endereco">6685 Blossom Hill Rd</span>
            </div>
        </div>
    </div>
</body>
</html>
