<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>6b - Grid Layout responsivo</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eeecef;
        }

        .container {
            width: 500px;
            height: 260px;
            background-color: white;
            padding: 5px;
            display: grid;
            grid-template-columns: 3fr 2fr 2fr 1fr;
            grid-template-rows: 1.3fr 1fr 0.9fr;
            gap: 5px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .laranja {
            grid-column: 1;
            grid-row: 1;
            background-color: #f79c25;
        }

        .azul {
            grid-column: 1;
            grid-row: 2;
            background-color: #b7c9e0;
        }

        .amarelo {
            grid-row: 3;
            background-color: #f3b233;
            grid-column: 1 / 3;
        }

        .rosa {
            grid-column: 2;
            background-color: #f5b7a6;
            grid-row: 1 / 3;
        }

        .verde-claro {
            grid-row: 1;
            background-color: #c9e0de;
            grid-column: 3 / 5;
        }

        .verde {
            grid-column: 3;
            background-color: #bcca6e;
            grid-row: 2 / 4;
        }

        .bolinhas {
            grid-column: 4;
            grid-row: 2 / 4;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .bolinha {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .b1 { background-color: #f0955f; }
        .b2 { background-color: #dcb2b0; }
        .b3 { background-color: #c2cda1; }
        .b4 { background-color: #d9cdee; }

        @media screen and (max-width: 600px) {
            body {
                height: auto;
                padding: 20px 0;
            }

            .container {
                width: 90%;
                height: auto;
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .container div {
                grid-column: auto;
                grid-row: auto;
                min-height: 80px;
            }

            .container .bolinhas {
                flex-direction: row;
                min-height: 50px;
            }

            .container .bolinha {
                min-height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="laranja"></div>
        <div class="rosa"></div>
        <div class="verde-claro"></div>
        <div class="azul"></div>
        <div class="verde"></div>
        <div class="bolinhas">
            <div class="bolinha b1"></div>
            <div class="bolinha b2"></div>
            <div class="bolinha b3"></div>
            <div class="bolinha b4"></div>
        </div>
        <div class="amarelo"></div>
    </div>
</body>
</html>
